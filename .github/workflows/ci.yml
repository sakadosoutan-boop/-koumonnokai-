name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 進行・保存・学習機能の回帰テスト
        run: npm test
      - name: 配布用の一枚HTMLが最新か
        run: |
          npm run build
          git diff --exit-code -- dist/index.html || { echo "::error::dist/index.html が古いままです。npm run build の結果をコミットしてください。"; exit 1; }

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 縦書きに対応した日本語フォント
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Playwright と Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 実ブラウザーでの画面確認（PC・縦長・3D）
        run: npm run test:browser
