<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鴻門の会 — 場面の点検</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui;background:#171b22;color:#eee5d0}body{display:grid;grid-template-rows:1fr auto}main{position:relative;min-height:0}canvas{width:100%;height:100%;display:block}#overlay{position:absolute;inset:0;pointer-events:none}footer{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{display:flex;gap:6px;align-items:center}button,select{padding:8px;background:#343b46;color:inherit;border:1px solid #69717c;border-radius:5px;font:inherit}p{width:100%;margin:0;color:#bcb7aa}a{color:#dfc18c}.km-prep{display:none}.km-prep.show{display:block}</style>
<main><canvas id="scene"></canvas><div id="overlay"></div></main><footer>
<label>場所<select id="place"></select></label><label>照明<select id="light"><option value="">本編の照明</option><option value="day">昼</option><option value="dusk">夕方</option><option value="night">夜</option><option value="dawn">夜明け</option><option value="lamp">灯火</option><option value="moon">月明かり</option><option value="snow">雪の夜</option><option value="snowin">雪の夜の陣幕</option><option value="palace">宮殿</option></select></label>
<label>注目<select id="actor"><option value="wide">全景</option></select></label><button id="left">左へ45度</button><button id="right">右へ45度</button><button id="wide">全景に戻す</button><button id="breach">衛士を押しのける</button><button id="play">一時停止</button><label>経過時間<input id="time" type="range" min="0" max="12000" value="0" step="10"></label><output id="status"></output><a href="banquet-scenes.html">宴席の動作</a><a href="character-gallery.html">人物の比較</a><p>本編と同じ背景・人物を使う点検用画面です。場所・照明を切り替え、横からの接触や途中の姿勢を確認できます。</p></footer>
<script src="../src/vendor/three.min.js"></script><script src="../src/js/koumon-lighting.js?v=20261026f"></script><script src="../src/js/koumon-figkit.js?v=20261026f"></script><script src="../src/js/koumon-head-assets.js?v=20261114a"></script><script src="../src/js/koumon-heads.js?v=20261114a"></script><script src="../src/js/koumon-hand-assets.js?v=20261026f"></script><script src="../src/js/koumon-hands.js?v=20261026f"></script><script src="../src/js/koumon-costume.js?v=20261102c"></script><script src="../src/js/koumon-banquet-props.js?v=20261027b"></script><script src="../src/js/koumon-cast3d.js?v=20261114a"></script><script src="../src/js/koumon-3d.js?v=20261106a"></script>
<script>
(function(){'use strict';const $=id=>document.getElementById(id),stage=KoumonStage3D;
const scenes={bashang:['覇上',['hai','ryo','kai']],koumon:['鴻門の陣',['u','zo','msg']],tent:['夜の陣幕',['hai','ryo','haku']],gate:['軍門',['kai','ryo','ei']],feast:['宴席',['u','zo','hai','ryo','haku','sou']],road:['脱出路',['hai','kai']],gaixia:['垓下',['u']],gutent:['帳中（虞美人）',['u','gu']],ukou:['烏江',['u','tei','rba']],nangong:['南宮',['ko','ou']]};
const names={gu:'虞美人',hai:'劉邦',ryo:'張良',kai:'樊噲',u:'項羽',zo:'范増',msg:'使者',haku:'項伯',ei:'衛士',ei2:'衛士（二）',sou:'項荘',tei:'亭長',rba:'呂馬童',ko:'高祖',ou:'叔孫通',run0:'従者（一）',run1:'従者（二）',run2:'従者（三）',off0:'臣下（一）',off1:'臣下（二）',off2:'臣下（三）'};
for(const [id,[name]] of Object.entries(scenes))$('place').add(new Option(name,id));
let playing=true,origin=0;if(!stage.mount($('scene'),$('overlay'))){$('status').textContent='3Dを表示できません';return;}
function settleCamera(){if(stage.S.to)stage.S.tStart=stage.S.t-2;stage.renderOnce();}
async function load(){stage.stop();$('place').disabled=$('light').disabled=$('time').disabled=true;try{const id=$('place').value;await stage.setScene(id==='gutent'?'tent':id,$('light').value||(id==='gutent'?'snowin':''),scenes[id][1],id==='feast'?{sou:'dance'}:{});origin=stage.S.t;$('time').value='0';$('actor').replaceChildren(new Option('全景','wide'));for(const actor of Object.keys(stage.S.cast))$('actor').add(new Option(names[actor]||actor,actor));$('breach').disabled=id!=='gate';if(playing)stage.start();else scrub();}catch(error){$('status').textContent=error.message;}finally{$('place').disabled=$('light').disabled=$('time').disabled=false;}}
function scrub(){stage.stop();stage.S.t=origin+Number($('time').value)/1000-.016;if(stage.S.to)stage.S.tStart=stage.S.t-2;stage.renderOnce();$('status').textContent=(Number($('time').value)/1000).toFixed(2)+' 秒';}
$('place').onchange=$('light').onchange=load;
$('actor').onchange=()=>{stage.focus($('actor').value,.82,{followEntry:false});if(!playing)settleCamera();};
$('wide').onclick=()=>{$('actor').value='wide';stage.focus('wide',undefined,{followEntry:false});if(!playing)settleCamera();};
function orbit(angle){const arm=stage.S.cam.pos.clone().sub(stage.S.cam.tgt);arm.applyAxisAngle(new THREE.Vector3(0,1,0),angle);const pos=stage.S.cam.tgt.clone().add(arm),tgt=stage.S.cam.tgt.clone();stage.S.from={pos:pos.clone(),tgt:tgt.clone()};stage.S.to={pos,tgt,id:null};stage.S.tStart=stage.S.t-2;stage.S.tDur=1.7;stage.S.drift=0;stage.renderOnce();}
$('left').onclick=()=>orbit(-Math.PI/4);$('right').onclick=()=>orbit(Math.PI/4);
$('breach').onclick=()=>{stage.setPose('kai','charge');stage.setPose('ei','down');origin=stage.S.t;$('time').value='0';playing=true;$('play').textContent='一時停止';stage.start();};
$('time').oninput=()=>{playing=false;$('play').textContent='再生';scrub();};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'一時停止':'再生';if(playing)stage.start();else scrub();};
stage.S.onFrame=()=>{if(playing){$('time').value=Math.min(12000,(stage.S.t-origin)*1000);$('status').textContent=(stage.S.t-origin).toFixed(2)+' 秒';}};
window.addEventListener('resize',()=>stage.resize());load();})();
</script></html>
