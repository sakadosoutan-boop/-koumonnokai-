<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鴻門の会 — 宴席の動作</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui,sans-serif;background:#171b22;color:#eee5d0}body{display:grid;grid-template-rows:1fr auto}main{position:relative;min-height:0}canvas{width:100%;height:100%;display:block}#overlay{position:absolute;inset:0;pointer-events:none}footer{padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#242831}h1{font:20px serif;margin:0 16px 0 0}select,button{font:inherit;background:#343b46;color:inherit;border:1px solid #69717c;border-radius:5px;padding:8px}label{display:flex;gap:8px;align-items:center}#timeline{width:180px}p{flex-basis:100%;font-size:12px;margin:0;color:#c1bba9}a{color:#dfc18c}.km-prep{position:absolute;top:22px;left:22px}.links{margin-left:auto} @media(max-width:700px){footer{gap:7px;padding:10px}h1{font-size:17px}#timeline{width:120px}}</style>
<style>.km-prep{display:none}.km-prep.show{display:block}</style><main><canvas id="scene"></canvas><div id="overlay"></div></main>
<footer><h1>鴻門の会　宴席の動作</h1><label for="action">場面<select id="action"><option value="enter">樊噲が帷を開いて乗り込む</option><option value="dance">項荘の剣舞</option><option value="block">項伯が身でかばう</option><option value="drink">樊噲の卮酒</option><option value="eat">樊噲と生彘肩</option></select></label><button id="wide">全景</button><button id="detail">人物へ寄る</button><button id="above">上から</button><button id="restart">最初から</button><button id="play">一時停止</button><label for="timeline">動作<input id="timeline" type="range" min="0" max="1000" value="0"></label><output id="phase"></output><span class="links"><a href="character-gallery.html">人物の比較</a> · <a href="../index.html">ゲームへ</a></span><p id="note">踏み込みと腰の返しに、水平の構え・頭上の弧・低い払いをつないだ剣舞です。</p></footer>
<script src="../src/vendor/three.min.js"></script><script src="../src/js/koumon-lighting.js?v=20261026f"></script><script src="../src/js/koumon-figkit.js?v=20261026f"></script><script src="../src/js/koumon-head-assets.js?v=20261026f"></script><script src="../src/js/koumon-heads.js?v=20261026f"></script><script src="../src/js/koumon-hand-assets.js?v=20261026f"></script><script src="../src/js/koumon-hands.js?v=20261026f"></script><script src="../src/js/koumon-costume.js?v=20261026f"></script><script src="../src/js/koumon-banquet-props.js?v=20261027b"></script><script src="../src/js/koumon-cast3d.js?v=20261027b"></script><script src="../src/js/koumon-3d.js?v=20261026g"></script>
<script>
(function(){'use strict';const $=id=>document.getElementById(id),stage=KoumonStage3D;let playing=true,actor='sou';
const wide=stage.STAGES.feast.wide.map(v=>v.slice());
if(!stage.mount($('scene'),$('overlay'))){$('note').textContent='この環境では3Dを表示できません。';return;}
async function load(){const a=$('action').value,isDance=a==='dance'||a==='block';actor=isDance?'sou':'kai';stage.stop();$('timeline').value='0';stage.STAGES.feast.wide=wide.map(v=>v.slice());stage.S.camera.fov=38;stage.S.camera.updateProjectionMatrix();$('action').disabled=true;$('timeline').disabled=true;
await stage.setScene('feast','day',['u','haku','hai','ryo',actor],{sou:'dance',haku:a==='block'?'dance':'sit',kai:a==='enter'?'enter':a==='eat'?'eat':a==='drink'?'drink':'glare'});
$('note').textContent=a==='enter'?'帳を開く、盾を前に踏み込む、足を止めて睨むまでを連続した動きで表現しています。':a==='eat'?'本文は盾を伏せて肉を載せ、剣で切って食べると記します。ひと塊のまま剣で持ち上げてかじる細部は創作演出です。':a==='drink'?'卮は漢代の円筒形・環耳付き漆器を参考にしています。':a==='block'?'項伯が項荘と沛公の間に立ち、身でかばう位置関係です。':'踏み込みと腰の返しに、水平の構え・頭上の弧・低い払いをつないだ剣舞です。';
if(playing)stage.start();else scrub();$('action').disabled=false;$('timeline').disabled=false;}
function scrub(){stage.stop();Object.values(stage.S.cast).forEach(f=>f.userData.state.actionProgress=Number($('timeline').value)/1000);stage.renderOnce();$('phase').textContent=stage.S.cast[actor].userData.state.motionPhase||'';}
$('action').onchange=load;$('wide').onclick=()=>{stage.S.camera.fov=38;stage.S.camera.updateProjectionMatrix();stage.STAGES.feast.wide=wide.map(v=>v.slice());stage.focus('wide',undefined,{followEntry:false});if(!playing){stage.S.t+=2;stage.renderOnce();}};
$('detail').onclick=()=>{stage.S.camera.fov=38;stage.S.camera.updateProjectionMatrix();stage.focus(actor,$('action').value==='eat'?1.6:.82);if(!playing){stage.S.t+=2;stage.renderOnce();}};
$('above').onclick=()=>{stage.S.camera.fov=50;stage.S.camera.updateProjectionMatrix();stage.STAGES.feast.wide=[[.1,4.3,1.65],[0,.45,1.2]];stage.focus('wide',undefined,{followEntry:false});if(!playing){stage.S.t+=2;stage.renderOnce();}};
$('restart').onclick=()=>{$('timeline').value='0';playing=false;$('play').textContent='再生';scrub();$('play').click();};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'一時停止':'再生';if(playing){if($('action').value==='enter'&&Number($('timeline').value)>=1000)$('timeline').value='0';Object.entries(stage.S.cast).forEach(([id,f])=>{const state=f.userData.state,cycle=KM_BANQUET.cycles[state.pose]||8;state.actionStart=stage.S.t+id.length-Number($('timeline').value)/1000*cycle;delete state.actionProgress;});stage.start();}else scrub();};
$('timeline').oninput=$('timeline').onchange=()=>{playing=false;$('play').textContent='再生';scrub();};
stage.S.onFrame=()=>{const f=stage.S.cast[actor];if(f&&playing){$('timeline').value=Math.round((f.userData.state.motionProgress||0)*1000);$('phase').textContent=f.userData.state.motionPhase||'';if($('action').value==='enter'&&f.userData.state.motionProgress>=1){playing=false;$('play').textContent='再生';stage.stop();}}};
const requested=new URLSearchParams(location.search).get('action');if(['enter','dance','block','drink','eat'].includes(requested))$('action').value=requested;
window.addEventListener('resize',()=>stage.resize());load();})();
</script></html>
